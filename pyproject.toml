[project]
name = "reality-travel-mcp"
version = "0.1.0"
description = "A stateful real-world travel MCP with weather, Street View, and journey archives."
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4,<4",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "tzdata>=2025.1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22"]

[project.scripts]
reality-travel = "reality_travel.server:main"

[tool.setuptools.packages.find]
include = ["reality_travel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
